name: Update Cyber Profile & Telemetry

on:
  schedule:
    - cron: '17 2 * * *'  # Daily scheduled sync at 02:17 UTC
  push:
    branches:
      - main
      - master
    paths:
      - 'assets/profile-pro.jpg'
      - 'assets/profile-pro.*'
      - 'scripts/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch live GitHub telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_data.py

      - name: Generate cyber terminal cards and portrait
        run: python scripts/make_portrait.py

      - name: Check and commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ ascii.svg name.svg assets/cards/
          if git diff --staged --quiet; then
            echo "Profile assets and telemetry are already up to date. Nothing to commit."
          else
            git commit -m "chore(telemetry): sync live GitHub metrics [skip ci]"
            git push
          fi
