name: Regenerate Cyber Terminal Profile Assets

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'assets/profile-pro.jpg'
      - 'assets/profile-pro.*'
      - 'scripts/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate cyber terminal cards and portrait
        run: python scripts/make_portrait.py

      - name: Check and commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ascii.svg name.svg assets/cards/
          if git diff --staged --quiet; then
            echo "Profile assets are already up to date. Nothing to commit."
          else
            git commit -m "chore(assets): regenerate cyber profile and cards [skip ci]"
            git push
          fi
