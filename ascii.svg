<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <defs>
    <!-- Dark Glass Chassis Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080b"/>
      <stop offset="40%" stop-color="#07151a"/>
      <stop offset="100%" stop-color="#092024"/>
    </linearGradient>

    <!-- Sub-Panel Background -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040b10"/>
      <stop offset="100%" stop-color="#061217"/>
    </linearGradient>

    <!-- Glowing Teal Border Gradient -->
    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2c3" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f2c3" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Top Highlight Sweep -->
    <linearGradient id="top-shine-hero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="15%" stop-color="#00f2c3" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Animated Horizontal Light Sweep Beam -->
    <linearGradient id="live-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2c3" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00f2c3" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#00f2c3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2c3" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="teal-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .term-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        fill: #00f2c3;
        font-weight: 500;
      }
      .live-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #00f2c3;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .sub-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #00f2c3;
        letter-spacing: 1.5px;
      }
      .ascii-face {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
        font-size: 7.2px;
        fill: #c9d1d9;
        font-weight: 500;
        white-space: pre;
      }
      .sys-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        fill: #00f2c3;
        font-weight: 600;
      }
      .sys-dots {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        fill: #143533;
        letter-spacing: 2px;
      }
      .sys-value {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        fill: #e6edf3;
        font-weight: 500;
      }
      .watermark {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9px;
        fill: #8b949e;
        opacity: 0.35;
      }
    </style>
  </defs>

  <!-- Outer Glass Frame -->
  <rect x="1" y="1" width="958" height="578" rx="16" fill="url(#hero-bg)" stroke="url(#hero-border)" stroke-width="1.2"/>
  <rect x="1" y="1" width="958" height="578" rx="16" fill="url(#top-shine-hero)"/>

  <!-- Top Terminal Header -->
  <path d="M 1 16 C 1 7.7 7.7 1 16 1 L 944 1 C 952.3 1 959 7.7 959 16 L 959 36 L 1 36 Z" fill="#04090e" stroke="#14262c" stroke-width="0.8"/>
  <line x1="1" y1="36" x2="959" y2="36" stroke="#00f2c3" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Window Dots -->
  <circle cx="24" cy="18" r="4.5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="4.5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="4.5" fill="#27c93f"/>

  <!-- Center Command Prompt -->
  <text x="480" y="22" text-anchor="middle" class="term-title">
    dexterbeast0-cmyk@github ~ $ ./profile-scan --live
  </text>

  <!-- Live Status Badge -->
  <circle cx="895" cy="18" r="3.5" fill="#00f2c3" filter="url(#teal-glow)"/>
  <text x="906" y="22" class="live-badge">LIVE</text>

  <!-- Left Sub-Panel: VISUAL.MAP -->
  <rect x="20" y="48" width="450" height="512" rx="12" fill="url(#panel-bg)" stroke="#00f2c3" stroke-width="1" stroke-opacity="0.25"/>
  <text x="36" y="70" class="sub-title">VISUAL.MAP</text>

  <!-- Right Sub-Panel: SYSTEM.INFO -->
  <rect x="480" y="48" width="460" height="512" rx="12" fill="url(#panel-bg)" stroke="#00f2c3" stroke-width="1" stroke-opacity="0.25"/>
  <text x="504" y="70" class="sub-title">SYSTEM.INFO</text>

