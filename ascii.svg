  <!-- Telemetry in SYSTEM.INFO -->
    <!-- Row: Subject -->
    <text x="504" y="94" class="sys-label">Subject</text>
    <text x="610" y="94" class="sys-dots">......................................</text>
    <text x="916" y="94" text-anchor="end" class="sys-value">Abhay Pratap singh</text>
    <!-- Row: Handle -->
    <text x="504" y="136" class="sys-label">Handle</text>
    <text x="610" y="136" class="sys-dots">......................................</text>
    <text x="916" y="136" text-anchor="end" class="sys-value">@dexterbeast0-cmyk</text>
    <!-- Row: Role -->
    <text x="504" y="178" class="sys-label">Role</text>
    <text x="610" y="178" class="sys-dots">......................................</text>
    <text x="916" y="178" text-anchor="end" class="sys-value">Software developer building in public</text>
