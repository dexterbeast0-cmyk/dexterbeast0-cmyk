<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <!-- Dark Glass Base -->
    <linearGradient id="work-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c"/>
      <stop offset="50%" stop-color="#07181e"/>
      <stop offset="100%" stop-color="#0a2228"/>
    </linearGradient>

    <!-- Sub-card background -->
    <linearGradient id="work-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040e13"/>
      <stop offset="100%" stop-color="#06161c"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="work-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2c3" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00f2c3" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="work-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="25%" stop-color="#00f2c3" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <filter id="donut-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .work-header {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #00f2c3;
        letter-spacing: 1.5px;
      }
      .work-pinned {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .proj-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #ffffff;
      }
      .proj-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        fill: #00f2c3;
        font-weight: 400;
      }
      .proj-pill {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #00f2c3;
      }
      .proj-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .donut-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 800;
        fill: #ffffff;
      }
      .watermark {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9px;
        fill: #8b949e;
        opacity: 0.35;
      }
    </style>
  </defs>

  <!-- Chassis -->
  <rect x="1" y="1" width="958" height="258" rx="16" fill="url(#work-bg)" stroke="url(#work-border)" stroke-width="1.2"/>
  <rect x="1" y="1" width="958" height="258" rx="16" fill="url(#work-shine)"/>

  <!-- Top Header Line -->
  <text x="32" y="32" class="work-header">PROJECTS.LIST &#160;&#160;&#160; <tspan fill="#8b949e">./projects.sh --all</tspan></text>
  <text x="928" y="32" text-anchor="end" class="work-pinned">2 pinned</text>
  <line x1="32" y1="42" x2="928" y2="42" stroke="#00f2c3" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Two Project Sub-Cards -->
  <g transform="translate(30, 56)">
    <!-- Sub-Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="436" height="176" rx="10" fill="url(#work-card-bg)" stroke="#00f2c3" stroke-width="0.8" stroke-opacity="0.25"/>
      <!-- Top mini bar inside card -->
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 426 0 C 431.5 0 436 4.5 436 10 L 436 28 L 0 28 Z" fill="#061217"/>
      <line x1="0" y1="28" x2="436" y2="28" stroke="#00f2c3" stroke-width="0.6" stroke-opacity="0.2"/>
      <circle cx="16" cy="14" r="3" fill="#00f2c3"/>
      <text x="26" y="18" font-family="ui-monospace, monospace" font-size="11" fill="#8b949e">dexterbeast0-cmyk</text>
      <circle cx="420" cy="14" r="3.5" fill="#39d353"/>

      <!-- Content -->
      <text x="20" y="56" class="proj-title">dexterbeast0-cmyk &#160;<tspan fill="#00f2c3">_</tspan></text>
      <text x="20" y="78" class="proj-desc">Building with code on GitHub.</text>

      <!-- Donut Progress Chart on Right -->
      <g transform="translate(380, 84)">
        <circle cx="0" cy="0" r="28" fill="none" stroke="#0b242e" stroke-width="7"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="7" stroke-dasharray="140.7 35.2" stroke-dashoffset="44" stroke-linecap="round" filter="url(#donut-glow)"/>
        <text x="0" y="4" text-anchor="middle" class="donut-text">80%</text>
      </g>

      <!-- Pill Tag -->
      <rect x="20" y="104" width="88" height="22" rx="11" fill="#062227" stroke="#00f2c3" stroke-width="0.8" stroke-opacity="0.35"/>
      <text x="64" y="119" text-anchor="middle" class="proj-pill">open-source</text>

      <!-- Footer Meta -->
      <text x="20" y="152" class="proj-meta">★ 0 &#160;&#160; updated 2026-09-08</text>
    </g>

    <!-- Sub-Card 2 -->
    <g transform="translate(464, 0)">
      <rect x="0" y="0" width="436" height="176" rx="10" fill="url(#work-card-bg)" stroke="#00f2c3" stroke-width="0.8" stroke-opacity="0.25"/>
      <!-- Top mini bar -->
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 426 0 C 431.5 0 436 4.5 436 10 L 436 28 L 0 28 Z" fill="#061217"/>
      <line x1="0" y1="28" x2="436" y2="28" stroke="#00f2c3" stroke-width="0.6" stroke-opacity="0.2"/>
      <circle cx="16" cy="14" r="3" fill="#00f2c3"/>
      <text x="26" y="18" font-family="ui-monospace, monospace" font-size="11" fill="#8b949e">toolkit</text>
      <circle cx="420" cy="14" r="3.5" fill="#39d353"/>

      <!-- Content -->
      <text x="20" y="56" class="proj-title">toolkit &#160;<tspan fill="#00f2c3">_</tspan></text>
      <text x="20" y="78" class="proj-desc">Reusable building blocks and utiliti</text>

      <!-- Donut Progress Chart on Right -->
      <g transform="translate(380, 84)">
        <circle cx="0" cy="0" r="28" fill="none" stroke="#0b242e" stroke-width="7"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="7" stroke-dasharray="114.3 61.6" stroke-dashoffset="44" stroke-linecap="round" filter="url(#donut-glow)"/>
        <text x="0" y="4" text-anchor="middle" class="donut-text">65%</text>
      </g>

      <!-- Pill Tag -->
      <rect x="20" y="104" width="88" height="22" rx="11" fill="#062227" stroke="#00f2c3" stroke-width="0.8" stroke-opacity="0.35"/>
      <text x="64" y="119" text-anchor="middle" class="proj-pill">utilities</text>

      <!-- Footer Meta -->
      <text x="20" y="152" class="proj-meta">★ 0 &#160;&#160; updated building</text>
    </g>
  </g>

  <!-- Watermark -->
  <text x="936" y="248" text-anchor="end" class="watermark">gitskins.com</text>
</svg>
